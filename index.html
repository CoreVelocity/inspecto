      return reader.read().then(function(res){
        if(res.done) return chunks;
        chunks.push(res.value); got+=res.value.length;
        // when the server does not report a size, ease toward 90% instead of faking a number
        set(total?4+(got/total)*86:Math.min(90,4+got/6000), 'Loading…');
        return pump();
      });
    })();
  }).then(function(chunks){
    set(94,'Starting up…');
    var blob=new Blob(chunks,{type:'text/javascript'});
    var url=URL.createObjectURL(blob);
    var s=document.createElement('script');
    s.onload=function(){ set(100,'Ready'); URL.revokeObjectURL(url); };
    s.onerror=function(){ URL.revokeObjectURL(url); plain(); };
    document.body.appendChild(s); s.src=url;
  }).catch(function(){ set(50,'Loading…'); plain(); });
})();
</script>
</body>
</html>
